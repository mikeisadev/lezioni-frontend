<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lezione Flexbox</title>

    <style>
        .container,
        .custom-container {
            display: flex;
            flex-direction: row;

            gap: 10px;

            justify-content: start;
            align-items: center;

            flex-wrap: wrap;

            height: 300px;

            background: lightblue;
        }

        .bigger-box {
            width: 250px !important;
            height: 250px !important;
        }

        .bigger-bigger-box {
            width: 500px !important;
            height: 500px !important;
        }

        .box {
            background: rgb(237, 154, 11);
            width: 100px;
            height: 100px;
            border: 2px solid black;

            display: flex;
        }

        .box:nth-child(odd) {
            align-items: top;
        }

        .box:nth-child(even) {
            align-items: center;
        }

        @media (max-width: 480px) {
            .container {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="dimensioni"></div>

    <h1>Lezione flexbox</h1>

    <div class="container">
        <div class="box">Elemento 1</div>
        <div class="box">Elemento 2</div>
        <div class="box">Elemento 3</div>
        <div class="box">Elemento 4</div>
        <div class="box">Elemento 5</div>
        <div class="box">Elemento 6</div>
        <div class="box">Elemento 7</div>
        <div class="box">Elemento 8</div>
    </div>

    <h1>Lezione flexbox personalizzata</h1>

    <div class="custom-container">
        <div class="box bigger-box">Elemento 1</div>
        <div class="box">Elemento 2</div>
        <div class="box">Elemento 3</div>
        <div class="box">Elemento 4</div>
        <div class="box bigger-bigger-box">Elemento 5</div>
        <div class="box">Elemento 6</div>
        <div class="box">Elemento 7</div>
        <div class="box">Elemento 8</div>
    </div>
</body>

</html>
